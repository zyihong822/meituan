<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>美团租赁数据中心</title><style>/*STYLE*/</style></head><body>
<aside class="sidebar"><div class="brand"><b>租</b>闪租运营</div><div class="side-label">运营分析</div><nav aria-label="模块导航"><a class="active" href="#dashboard">数据看板</a><a href="#funnel">经营漏斗</a><a href="#products">商品行为列表</a></nav><small>闪租数据中心</small></aside>
<div class="main"><header class="topbar"><span>数据中心 / 美团渠道 / 租赁分析</span><span class="pill">示例数据</span></header><main>
<div class="page-head"><div><h1>美团租赁数据中心</h1></div><div class="stamp">更新至 2026-10-23 23:59</div></div>
<div id="globalTimeBar" class="panel filters time-filter-bar" role="region" aria-label="全局时间筛选"><div class="field global-time"><span>统计时间</span><div id="globalDate"></div></div></div>
<section class="panel" id="dashboard"><div class="section-head"><h2>数据看板</h2><div class="actions"><button type="button" id="configureDashboard">指标配置</button><button type="button" id="exportDashboard">导出数据</button></div></div><div id="overviewGrid" class="overview-grid"></div></section>
<section class="panel flow-panel" id="funnel"><div class="section-head"><h2>经营漏斗</h2><div class="funnel-options"><div class="funnel-legend" aria-label="数据来源图例"><span><i class="legend-platform"></i>美团侧</span><span><i class="legend-mini"></i>小程序侧</span></div><details id="funnelSettings"><summary>选择漏斗节点 <span aria-hidden="true">⌄</span></summary><div id="funnelNodeOptions" class="funnel-option-panel"></div></details></div></div><div id="flowContent"></div></section>
<section class="panel" id="products"><div class="section-head"><div><h2>租赁商品数据</h2></div><div class="actions"><button id="exportProducts">导出</button></div></div><form id="productFilters" class="product-filter-form"><div class="global-filter-grid rental-product-filter-grid"><label class="field">商品类目<select id="category"><option value="all">全部类目</option><option>手机</option><option>摄影器材</option><option>游戏设备</option></select></label><label class="field">商品名称<input type="search" id="search" placeholder="搜索商品名称" autocomplete="off"></label><label class="field id-search">商品ID<textarea id="productIds" rows="1" placeholder="多个ID用逗号、空格或换行分隔，如 10021,10022" aria-describedby="idHint"></textarea></label><div class="actions"><button class="primary" type="submit">查询</button><button type="button" id="resetFilters">重置</button></div></div><div class="filter-status-row"><span id="filterStatus" role="status"></span></div><div id="idHint" class="filter-id-hint" aria-live="polite"></div></form><div id="tableWrap" class="table-scroll"></div><div id="productPagination"></div></section>
</main></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭弹窗">×</button></div><div class="dialog-body" id="dialogBody"></div><div class="dialog-footer" id="dialogFooter"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<div id="metricTooltip" role="tooltip" hidden></div><script>/*SCRIPT*/</script></body></html>
